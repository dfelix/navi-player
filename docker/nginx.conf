# Example nginx site for a *static* NaviPlayer deployment (`npm run build`,
# then serve dist/), with Navidrome proxied on the same origin.
#
# Same origin means the browser needs no CORS and the equalizer can read the
# audio. Build with the public URL of this site:
#   VITE_NAVIDROME_URL=https://music.example.com npm run build
#
# Adjust server_name, certificate paths, the dist/ path and the Navidrome
# upstream (127.0.0.1:4533 here) to your setup.

upstream navidrome {
    server 127.0.0.1:4533;
}

server {
    listen 80;
    server_name music.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;

    root /srv/navi-player/dist;
    index index.html;

    # Security headers for the app. The CSP allows Google Fonts (the app's
    # typefaces); LRCLIB is reached through the relay below, on this origin.
    # nginx gotcha: any add_header inside a location replaces ALL of these for
    # that location, which is why the locations below use `expires` for caching.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Navidrome, on the same origin ---
    location ~ ^/(rest|auth|api|share)/ {
        proxy_pass http://navidrome;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long tracks and big downloads stream; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 0;
        # Replaces the app CSP above: Navidrome's own share pages use inline
        # scripts that it would block.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Online lyrics (LRCLIB), relayed on the same origin ---
    # The bundled Node server does this itself (server/lrclib.ts), with a
    # cache and rate-limit handling; this is the plain-nginx equivalent. The
    # browser can't read LRCLIB's rate-limit answers directly (no CORS on them).
    location ~ ^/lyrics/lrclib/(get|search)$ {
        proxy_pass https://lrclib.net/api/$1$is_args$args;
        proxy_set_header Host lrclib.net;
        proxy_set_header User-Agent "navi-player (nginx relay)";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_server_name on;
        proxy_read_timeout 10s;
        resolver 1.1.1.1 9.9.9.9 valid=300s;
    }

    # Build files have a content hash in their names, so they never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html and the service worker must never be cached, or clients get
    # stale bundles.
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }

    # Any other path is a page of the app: serve the app, which routes it
    # (so links and reloads work).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
